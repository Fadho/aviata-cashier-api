name: Deploying Cashier Server

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: node:20
    steps:
      - uses: actions/checkout@v3
        with:
          node-version: 20

      - run: npm install

      - name: Install sshpass
        run: apt-get update && apt-get install -y sshpass

      - name: Deploy using SCP with password
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD2 }}" scp -o StrictHostKeyChecking=no -r ./src Dockerfile package*.json ecosystem.config.json ${{ secrets.SSH_USER2 }}@${{ secrets.SSH_USER2 }}:~/aviata-websocket

      - name: Restart Server via SSH with password
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD2 }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER2 }}@${{ secrets.SSH_USER2 }} "cd ~/aviata-websocket && npm install && pm2 del all && npm run start"

      - name: Build, tag and push Dockerfile
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD2 }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER2 }}@${{ secrets.SSH_USER2 }} "cd ~/aviata-websocket && docker build -t cashier-service . && docker tag cashier-service registry.digitalocean.com/aviata/cashier-service && docker push registry.digitalocean.com/aviata/cashier-service"

      - name: Docker Compose and scale
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD2 }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER2 }}@${{ secrets.SSH_USER2 }} "cd ~/aviata-docker && docker compose up -d cashier-service && docker compose scale cashier-service=12"
